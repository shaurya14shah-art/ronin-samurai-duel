# Fly.io config for RŌNIN (one machine: rooms, accounts and records live in that process and
# its volume). Set `app` to your own app name before `fly launch` / `fly deploy`. See docs/DEPLOY.md.
app = "ronin-CHANGE-ME"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[[mounts]]
  source = "ronin_data"
  destination = "/app/server/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Duels are in memory: keep the one machine running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
